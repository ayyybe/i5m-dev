<script>
const [__, temp, late, ___] = ['[', 'ibrah', 'm', '@localhost ~]$ ']
const steps = [...Array(5)].map((_, n) => [temp.slice(0, temp.length - n), n + 1, late].join(''))
const leaps = [[...Array(5)].map((_, n) => [__ + temp.slice(0, temp.length - n), n + 1, late + ___])]

       //////////////////////////////////////////////////
      // yo. i hate semicolons and love esoteric code //
        //''''''''''''''''''''''''''''''''''''''''''''
[-0.0];

(() => {
  const [ibrah, i, m] = document.querySelectorAll('orz')
  let t = 0, d = -1
  function tick() {
    document.title = `${steps[t]} said: yo`
    const [prefix, n, suffix] = leaps[t]
    ibrah.innerText = prefix
    i.innerText = n
    m.innerText = suffix
    if (t == 0 || t == steps.length - 1) {
      d = -d
      i.classList.remove('ticking')
      clearInterval(tickLoop)
      tickWait = setTimeout(resume, d > 0 ? 1200 : 1800)
    }
    t += d
  }

  let tickLoop, tickWait
  function resume() {
    i.classList.add('ticking')
    tickLoop = setInterval(tick, 150)
    tick()
  }

  // the minigame borrows the name + title bar, and needs the name a fixed
  // width while it is a wall you can bounce off of
  window.nameLoop = {
    stop() {
      clearInterval(tickLoop)
      clearTimeout(tickWait)
      i.classList.remove('ticking')
      t = 0
      d = -1
      const [prefix, n, suffix] = leaps[0]
      ibrah.innerText = prefix
      i.innerText = n
      m.innerText = suffix
    },
    start() {
      clearInterval(tickLoop)
      clearTimeout(tickWait)
      t = 0
      d = -1
      resume()
    }
  }

  resume()
})()
</script>

(() => {
  const cvs = document.getElementById('screen')
  const ctx = cvs.getContext('2d')
  const dash = document.querySelector('dashboard')
  const BIO = dash.innerHTML
  const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace'
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v
  const rnd = (a, b) => a + Math.random() * (b - a)

  const MUSIC_SRC = ['lobstrokk_incredim_compressed.ogg', 'lobstrokk_extended.mp3']
  const MUSIC_PRELOAD = true
  const MUSIC_VOL = 0.22      // the mp3/ogg backend
  const MASTER_VOL = 1.15     // webaudio: the chiptune and every sound effect
  const MUSIC_RATE = false     // let phase tempo nudge playbackRate in file mode

  const IDLE = 0, SAVER = 1, WHACK = 2, DODGE = 3, BRK = 4, DONE = 5
  const PLAYING = s => s === WHACK || s === DODGE || s === BRK
  const TARGET = 7, SURVIVE = 45, BACK = 0.85, LIVES = 5
  const START_SPEED = 420, MAX_SPEED = 880, MIN_SIZE = 0.62

  // sitting on the content is invulnerable (it stops bullets and logos bounce
  // off it) and so is taking the pointer off the page. both are on a clock.
  const CAMP_MAX = 10, CAMP_PAD = 6

  // a clear is always 7 hits and 13 bricks, so those alone score the same every
  // win. the parts that actually vary are how long you lasted, how much of the
  // bullet hell you saw, what you had left, and how fast you took the bio apart.
  const PTS_HIT = 20, PTS_SEC = 8, PTS_WAVE = 60, PTS_BRICK = 30
  const PTS_LIFE = 300, PTS_PAD = 80, PAR_PAD_MULT = 2
  // CAMP_MAX is the whole phase's hiding allowance. it never refills, so the
  // counter on screen only ever goes down and spending all of it ends the run.
  // PTS_VOID is the full payout for never touching it.
  const PTS_CLICK = 100, PAR_CLICK_MULT = 2, PTS_VOID = 800

  // phase 2 escalates in waves. each one turns on another way to die.
  //   gap  seconds between new logos      emit  seconds between aimed shots
  //   ring seconds between 14-way bursts  spin  seconds between spiral shots
  const WAVES = [
    { at: 0,  msg: null,                     cap: 6,  gap: 3.0, emit: 0,    ring: 0,   spin: 0    },
    { at: 6,  msg: 'they shoot back now',    cap: 8,  gap: 2.6, emit: 0.8,  ring: 0,   spin: 0    },
    { at: 13, msg: 'one of them is hunting', cap: 10, gap: 2.3, emit: 0.6,  ring: 5,   spin: 0,    hunter: true },
    { at: 20, msg: 'ring shots',             cap: 12, gap: 2.0, emit: 0.45, ring: 3.2, spin: 0    },
    { at: 28, msg: 'spiral',                 cap: 14, gap: 1.7, emit: 0.34, ring: 2.6, spin: 0.09, hunter: true },
    { at: 37, msg: 'surge',                  cap: 16, gap: 1.4, emit: 0.22, ring: 1.9, spin: 0.06, hunter: true }
  ]
  const MAXBITS = 320

  let state = IDLE
  let W = 0, H = 0, scale = 1
  let logos = [], bits = [], parts = [], paddle = null, walls = []
  let mx = -1e5, my = -1e5, pointerIn = false
  let touch = false, grabX = 0, grabY = 0
  const LIFT = 64
  let raf = 0, last = 0
  let score = 0, hits = 0, clicks = 0, padHits = 0, bricksTotal = 0, lives = LIVES, clock = 0, spawnIn = 0, invuln = 0
  let waveIdx = 0, emitIn = 0, burstIn = 0, spinIn = 0, spinAng = 0, toast = null
  let camp = CAMP_MAX, zones = [], dims = []
  let shake = 0, flash = 0, saverAge = 0, T = 0
  let banner = null, endMsg = null, lastTitle = ''

  /* ---------------------------------------------------------- audio */

  const A = { ctx: null, out: null, muted: false, on: false, next: 0, step: 0, bpm: 132, seq: 0, noise: null, el: null }
  const midi = n => 440 * Math.pow(2, (n - 69) / 12)
  const BASS = [0, 0, 7, 0, 5, 0, 7, 3, 0, 0, 7, 0, 10, 7, 5, 3]
  const LEAD = [12, 15, 19, 15, 22, 19, 15, 12, 10, 14, 17, 14, 19, 17, 14, 10]

  function audioUp() {
    if (A.ctx) return
    const C = window.AudioContext || window.webkitAudioContext
    if (!C) return
    // no audio device, safari private mode, etc. the game still plays silent
    try {
      A.ctx = new C()
      A.out = A.ctx.createGain()
      A.out.gain.value = MASTER_VOL
      // a surge wave can fire a dozen overlapping tones. at this level their
      // sum would clip, so everything goes through a limiter on the way out.
      // measured worst case is a 0.715 peak during a wave 6 surge, so the gain
      // above cannot clip on its own. this only guards content i have not
      // measured, and the attack is short enough to actually catch a transient.
      const cap = A.ctx.createDynamicsCompressor()
      cap.threshold.value = -1
      cap.knee.value = 3
      cap.ratio.value = 20
      cap.attack.value = 0.0005
      cap.release.value = 0.1
      A.out.connect(cap)
      cap.connect(A.ctx.destination)
      A.noise = A.ctx.createBuffer(1, A.ctx.sampleRate * 0.2, A.ctx.sampleRate)
      const d = A.noise.getChannelData(0)
      for (let k = 0; k < d.length; k++) d[k] = Math.random() * 2 - 1
    } catch (e) {
      A.ctx = null
    }
  }

  function tone(hz, at, dur, type, vol) {
    if (!A.ctx || A.muted) return
    const o = A.ctx.createOscillator()
    const g = A.ctx.createGain()
    o.type = type || 'square'
    o.frequency.setValueAtTime(hz, at)
    g.gain.setValueAtTime(0.0001, at)
    g.gain.linearRampToValueAtTime(vol, at + 0.006)
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur)
    o.connect(g)
    g.connect(A.out)
    o.start(at)
    o.stop(at + dur + 0.02)
  }

  function hat(at, dur, vol) {
    if (!A.ctx || A.muted) return
    const s = A.ctx.createBufferSource()
    const g = A.ctx.createGain()
    const f = A.ctx.createBiquadFilter()
    s.buffer = A.noise
    f.type = 'highpass'
    f.frequency.value = 7000
    g.gain.setValueAtTime(vol, at)
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur)
    s.connect(f)
    f.connect(g)
    g.connect(A.out)
    s.start(at)
    s.stop(at + dur)
  }

  function sfx(kind) {
    if (!A.ctx || A.muted) return
    const t = A.ctx.currentTime
    if (kind === 'bounce') tone(midi(74 + ((Math.random() * 6) | 0)), t, 0.045, 'square', 0.16)
    if (kind === 'hit') { tone(midi(76), t, 0.07, 'square', 0.4); tone(midi(88), t + 0.045, 0.09, 'square', 0.3) }
    if (kind === 'miss') tone(midi(48), t, 0.09, 'sawtooth', 0.18)
    if (kind === 'split') [0, 1, 2, 3].forEach(k => tone(midi(60 + k * 7), t + k * 0.05, 0.12, 'square', 0.3))
    if (kind === 'brick') { tone(midi(84), t, 0.05, 'square', 0.3); hat(t, 0.05, 0.2) }
    if (kind === 'pad') tone(midi(64), t, 0.06, 'triangle', 0.4)
    if (kind === 'shot') tone(midi(70), t, 0.04, 'square', 0.12)
    if (kind === 'burst') [0, 1, 2].forEach(k => tone(midi(58 + k * 3), t + k * 0.03, 0.14, 'sawtooth', 0.2))
    if (kind === 'hurt') [0, 1, 2].forEach(k => tone(midi(52 - k * 5), t + k * 0.07, 0.14, 'sawtooth', 0.35))
    if (kind === 'corner') [0, 1, 2, 3, 4].forEach(k => tone(midi(72 + k * 4), t + k * 0.04, 0.3, 'square', 0.3))
    if (kind === 'dead') [0, 1, 2, 3].forEach(k => tone(midi(50 - k * 4), t + k * 0.13, 0.4, 'sawtooth', 0.35))
    if (kind === 'win') [0, 4, 7, 12, 16, 19].forEach((n, k) => tone(midi(60 + n), t + k * 0.1, 0.5, 'square', 0.3))
  }

  function pump() {
    if (!A.on || !A.ctx) return
    const spb = 60 / A.bpm / 2
    while (A.next < A.ctx.currentTime + 0.15) {
      const s = A.step % 16
      tone(midi(33 + BASS[s]), A.next, spb * 0.9, 'triangle', 0.5)
      if (state !== WHACK || s % 2 === 0) tone(midi(57 + LEAD[s]), A.next, spb * 0.55, 'square', 0.14)
      if (s % 2 === 1) hat(A.next, 0.03, 0.09)
      A.next += spb
      A.step++
    }
  }

  // older safari will not play ogg vorbis, so the mp3 stays as a fallback.
  // only the chosen one is ever fetched.
  function pickSrc() {
    const probe = document.createElement('audio')
    for (let k = 0; k < MUSIC_SRC.length; k++) {
      const src = MUSIC_SRC[k]
      const type = /\.ogg$/.test(src) ? 'audio/ogg; codecs=vorbis' : 'audio/mpeg'
      if (!probe.canPlayType || probe.canPlayType(type)) return src
    }
    return MUSIC_SRC[MUSIC_SRC.length - 1]
  }

  // built once, told to buffer immediately, so starting the game never waits
  // on the network. constructing it does not play it.
  function makeTrack() {
    if (A.el) return A.el
    const el = new Audio()
    el.loop = true
    el.preload = 'auto'
    el.volume = MUSIC_VOL
    el.src = pickSrc()
    A.el = el
    return el
  }

  function musicOn() {
    if (A.on) return
    if (MUSIC === 'file') {
      const el = makeTrack()
      A.on = true
      el.volume = A.muted ? 0 : MUSIC_VOL
      el.currentTime = 0
      const go = el.play()
      if (go && go.catch) go.catch(() => {})
      return
    }
    if (!A.ctx) return
    A.on = true
    A.step = 0
    A.next = A.ctx.currentTime + 0.06
    A.seq = setInterval(pump, 25)
  }

  function musicOff() {
    A.on = false
    clearInterval(A.seq)
    if (A.el) A.el.pause()
  }

  // synth mode changes tempo outright. file mode can only nudge playbackRate,
  // and only if asked, since it pitches the track up with it.
  function setTempo(bpm) {
    A.bpm = bpm
    if (MUSIC === 'file' && MUSIC_RATE && A.el) A.el.playbackRate = clamp(bpm / 132, 1, 1.12)
  }

  function setMuted(v) {
    A.muted = v
    if (A.out) A.out.gain.value = v ? 0 : MASTER_VOL
    if (A.el) A.el.volume = v ? 0 : MUSIC_VOL
  }

  /* ------------------------------------------------------- geometry */

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    W = window.innerWidth
    H = window.innerHeight
    scale = clamp(W / 900, 0.55, 1)
    cvs.width = Math.round(W * dpr)
    cvs.height = Math.round(H * dpr)
    cvs.style.width = W + 'px'
    cvs.style.height = H + 'px'
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    measure()
    for (const L of logos) {
      // clamping alone can shove a logo into content that is now wider than the
      // viewport, and a phase banner would freeze it there
      contain(L)
      eject(L)
    }
    if (paddle) {
      paddle.y = H - 28
      paddle.x = clamp(paddle.x, 0, W - paddle.w)
    }
  }

  // the content is not one box. the name, the penguin and the bio are three
  // separate walls, otherwise the logo bounces off a lot of empty black.
  function measure() {
    walls = []
    const put = (el, brick) => {
      if (!el) return
      const b = el.getBoundingClientRect()
      if (b.width < 1 || b.height < 1) return
      walls.push({ l: b.left - 1, t: b.top - 1, r: b.right + 1, b: b.bottom + 1, el, brick })
    }
    const nameEl = document.querySelector('mogging')
    const pengEl = document.querySelector('cracked img')
    put(nameEl, false)
    put(pengEl, false)
    // the penguin collides as its silhouette, not its box. otherwise the gaps
    // inside the box are unreachable, and now that they are not camping either
    // they would be free hiding spots.
    const pw = walls[walls.length - 1]
    if (pw && pw.el === pengEl) pw.mask = PENG
    if (state === BRK) document.querySelectorAll('brik:not(.dead)').forEach(el => put(el, true))
    else put(dash, false)

    buildZones()
  }

  function buildZones() {
    const nameEl = document.querySelector('mogging')
    const pengEl = document.querySelector('cracked img')
    zones = []
    dims = []
    const zone = (l, t, r, b) => zones.push({ l: l - CAMP_PAD, t: t - CAMP_PAD, r: r + CAMP_PAD, b: b + CAMP_PAD })
    const dim = (l, t, r, b) => dims.push({ l: l - CAMP_PAD, t: t - CAMP_PAD, r: r + CAMP_PAD, b: b + CAMP_PAD })
    const box = el => (el ? el.getBoundingClientRect() : null)
    const nb = box(nameEl)
    if (nb && nb.width > 0) { zone(nb.left, nb.top, nb.right, nb.bottom); dim(nb.left, nb.top, nb.right, nb.bottom) }
    const pb = box(pengEl)
    if (pb && pb.width > 0) {
      if (PENG.any) {
        const sx = pb.width / PENG.iw, sy = pb.height / PENG.ih
        for (let y = 0; y < PENG.rows.length; y++) {
          for (const run of PENG.rows[y]) {
            zone(pb.left + run[0] * sx, pb.top + y * sy,
                 pb.left + run[1] * sx, pb.top + (y + 1) * sy)
          }
        }
      } else zone(pb.left, pb.top, pb.right, pb.bottom)
      // the overlay covers the whole square. the mask is frozen on frame 1 and
      // the bird is not, so dimming the silhouette would leave it half lit.
      dim(pb.left, pb.top, pb.right, pb.bottom)
    }
    const db = box(dash)
    if (db && db.width > 0) { zone(db.left, db.top, db.right, db.bottom); dim(db.left, db.top, db.right, db.bottom) }
  }

  // off the page counts too, otherwise you just park the mouse outside
  function camping() {
    if (!pointerIn) return true
    for (const z of zones) if (cursorHits(z.l, z.t, z.r, z.b)) return true
    return false
  }

  const overlaps = (L, o) => L.x < o.r && L.x + L.w > o.l && L.y < o.b && L.y + L.h > o.t

  // the solid part of wall o that x0..y1 actually touches, or null. plain walls
  // return themselves. masked ones return the sub-rect of the silhouette that
  // was hit, which is what the bounce then resolves against.
  function solidAt(x0, y0, x1, y1, o) {
    if (x1 <= o.l || x0 >= o.r || y1 <= o.t || y0 >= o.b) return null
    if (!o.mask || !o.mask.any) return o
    const m = o.mask
    const sx = (o.r - o.l) / m.iw, sy = (o.b - o.t) / m.ih
    const r0 = Math.max(0, Math.floor((y0 - o.t) / sy))
    const r1 = Math.min(m.ih - 1, Math.ceil((y1 - o.t) / sy) - 1)
    let al = Infinity, at = Infinity, ar = -Infinity, ab = -Infinity
    for (let y = r0; y <= r1; y++) {
      const runs = m.rows[y]
      if (!runs) continue
      for (let k = 0; k < runs.length; k++) {
        const rl = o.l + runs[k][0] * sx, rr = o.l + runs[k][1] * sx
        if (rr <= x0 || rl >= x1) continue
        if (rl < al) al = rl
        if (rr > ar) ar = rr
        const rt = o.t + y * sy, rb = o.t + (y + 1) * sy
        if (rt < at) at = rt
        if (rb > ab) ab = rb
      }
    }
    return ar < al ? null : { l: al, t: at, r: ar, b: ab }
  }

  /* ------------------------------------------------------ the cursor

  the pointer is a 48x74 arrow but used to collide as a single point at its
  tip, so most of what you can see went through things. read the real alpha
  out of the png and collapse each row to spans of opaque pixels, then the
  hitbox is literally the shape on screen.                                */

  const CUR = { w: 48, h: 74, rows: null, img: null }

  // peng.gif is 200x195 but the bird only fills part of it, and it is cone
  // shaped, so a bounding box leaves big empty corners either side of its head.
  // this is the actual alpha mask, run length encoded per pixel row, the same
  // representation as the cursor. accumulated over several samples because it
  // animates and the silhouette moves.
  // canvas cannot read an animated gif's current frame (drawImage always hands
  // back frame 1), so the hitbox is frame 1, decoded offline as base36 pixel
  // runs per row. 22 percent of the box. the dim overlay deliberately does NOT
  // follow this: it covers the whole square, so the animating bird can never
  // crawl out from under a silhouette that cannot move.
  // REGENERATE IF peng.gif CHANGES.
  const PENG_MASK = ';;;;;;;;;;;;;;;;;;;;;;;;2p.2v;2n.2x;2l.2z;2k.31;2i.32;2h.34;2g.35;2f.37;2e.38;2d.39;2c.3a;2b.3b;2a.3c;29.3c;28.3d;27.3e;26.3f;25.3g;24.3g;24.3h;23.3i;22.3j;22.3j;21.3k;20.3l;20.3l;1z.3m;1x.3o;1w.3p;1u.3r;1t.3s;1s.3t;1r.3v;1p.3w;1o.3x;1n.3y;1m.3z;1l.41;1k.42;1j.43;1i.44;1i.44;1h.45;1g.46;1f.47;1e.48;1e.49;1d.49;1c.4a;1c.4b;1b.4b;1a.4c;1a.4c;19.4c;19.4d;18.4d;18.4e;18.3z,40.4e;17.1k,1l.40,42.4e;17.1j,1l.40,43.4e;16.1i,1l.40,44.4f;16.1h,1l.40,44.4f;16.1g,1l.40,45.4f;16.1g,1l.40,45.4f;15.1f,1l.40,46.4g;15.1f,1l.40,46.4g;15.1e,1l.40,47.4g;15.1d,1l.40,47.4g;14.1d,1l.40,48.4h;14.1c,1l.40,48.4h;14.1b,1l.40,49.4h;14.1b,1l.3z,49.4h;13.1a,1l.3z,4a.4h;13.1a,1m.3z,4a.4h;13.19,1m.3z,4b.4i;13.19,1m.3y,4c.4i;13.18,1n.3y,4c.4i;13.17,1n.3x,4d.4i;13.17,1o.3x,4e.4i;12.16,1o.3w,4e.4i;12.16,1p.3w,4f.4j;13.15,1p.3v,4g.4i;1q.3u;1r.3u;1s.3t;1s.3s;1u.3q;1v.3q;1w.3p;1v.3q;1u.3q;1u.3r;1t.3r;1t.3s;1t.3s;1s.3t;1s.3t;1s.3t;1s.3u;1s.3u;1r.3u;1r.3u;1r.3u;1r.3u;1r.2q,2r.3t;1s.2q,2v.3t;1s.2q,2v.3t;1s.2q,2v.3s;1t.2p,2w.3s;1t.2p,2w.3r;1u.2p,2w.3q;1v.2o,2w.3p;1w.2o,2x.3o;1y.2n,2x.3n;20.2m,2y.3k;22.2l,30.3i;25.2k,32.3d;29.2g;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;'
  const PENG = { any: false, rows: [], iw: 200, ih: 195 }

  function loadPengMask() {
    PENG.rows = PENG_MASK.split(';').map(r => r
      ? r.split(',').map(run => {
          const q = run.split('.')
          return [parseInt(q[0], 36), parseInt(q[1], 36)]
        })
      : [])
    PENG.ih = PENG.rows.length
    PENG.any = PENG.rows.some(r => r.length > 0)
    buildZones()
  }

  // the real pointer is a fixed 48x74 css px whatever the viewport. the touch
  // avatar scales with the layout, or it swallows half a phone screen.
  const curScale = () => touch ? scale : 1

  function loadCursor() {
    const img = new Image()
    img.onload = () => {
      CUR.w = img.naturalWidth
      CUR.h = img.naturalHeight
      const c = document.createElement('canvas')
      c.width = CUR.w
      c.height = CUR.h
      const g = c.getContext('2d')
      g.drawImage(img, 0, 0)
      let px
      // file:// taints the canvas in chrome. fall back to a coarse slab.
      try { px = g.getImageData(0, 0, CUR.w, CUR.h).data } catch (e) { return }
      const rows = []
      for (let y = 0; y < CUR.h; y++) {
        const runs = []
        let run = -1
        for (let x = 0; x < CUR.w; x++) {
          const on = px[(y * CUR.w + x) * 4 + 3] > 40
          if (on && run < 0) run = x
          if (!on && run >= 0) { runs.push([run, x]); run = -1 }
        }
        if (run >= 0) runs.push([run, CUR.w])
        rows.push(runs)
      }
      CUR.rows = rows
    }
    CUR.img = img
    img.src = 'cursor4x.png'
  }

  // the arrow hangs down and right of the hotspot, which is where mx,my is
  function cursorHits(l, t, r, b) {
    if (!pointerIn) return false
    const cs = curScale()
    const cw = CUR.w * cs, ch = CUR.h * cs
    if (mx > r || mx + cw < l || my > b || my + ch < t) return false
    if (!CUR.rows) return mx < r && mx + cw * 0.55 > l && my < b && my + ch * 0.75 > t
    const y0 = Math.max(0, Math.floor((t - my) / cs))
    const y1 = Math.min(CUR.h - 1, Math.ceil((b - my) / cs) - 1)
    for (let y = y0; y <= y1; y++) {
      const runs = CUR.rows[y]
      for (let k = 0; k < runs.length; k++) {
        if (mx + runs[k][1] * cs > l && mx + runs[k][0] * cs < r) return true
      }
    }
    return false
  }

  // on touch there is no pointer to collide with, so draw one. it is dragged
  // relative to the finger so it never sits underneath it.
  function drawAvatar() {
    const cs = curScale()
    const w = CUR.w * cs, h = CUR.h * cs
    ctx.save()
    ctx.shadowColor = '#000'
    ctx.shadowBlur = 6
    if (CUR.img) {
      ctx.drawImage(CUR.img, mx, my, w, h)
    } else {
      ctx.fillStyle = '#fff'
      ctx.beginPath()
      ctx.moveTo(mx, my)
      ctx.lineTo(mx + w * 0.72, my + h * 0.63)
      ctx.lineTo(mx + w * 0.30, my + h * 0.61)
      ctx.lineTo(mx + w * 0.43, my + h * 0.96)
      ctx.closePath()
      ctx.fill()
    }
    ctx.restore()
  }

  // growing a logo can push it past an edge, and a phase banner freezes physics
  // for over a second before anything would clamp it back
  function contain(L) {
    L.x = clamp(L.x, 0, Math.max(0, W - L.w))
    L.y = clamp(L.y, 0, Math.max(0, H - L.h))
  }

  // clamping to the viewport can still leave a logo buried in the content, and
  // a phase banner freezes physics for over a second before anything would push
  // it out. shove it to the nearest side that is actually on screen.
  function eject(L) {
    for (let pass = 0; pass < 6; pass++) {
      let moved = false
      for (const o of walls) {
        if (!overlaps(L, o)) continue
        const out = [
          { x: o.l - L.w, y: L.y }, { x: o.r, y: L.y },
          { x: L.x, y: o.t - L.h }, { x: L.x, y: o.b }
        ].filter(c => c.x >= 0 && c.x + L.w <= W && c.y >= 0 && c.y + L.h <= H)
        if (!out.length) continue
        out.sort((a, b) => Math.abs(a.x - L.x) + Math.abs(a.y - L.y) - Math.abs(b.x - L.x) - Math.abs(b.y - L.y))
        L.x = out[0].x
        L.y = out[0].y
        moved = true
      }
      if (!moved) return
    }
  }

  function openSpot(w, h) {
    for (let k = 0; k < 300; k++) {
      const box = { x: rnd(0, Math.max(1, W - w)), y: rnd(0, Math.max(1, H - h)), w, h }
      if (!walls.some(o => overlaps(box, o))) return box
    }
    return { x: 6, y: 6, w, h }
  }

  function heading(sp) {
    const rad = rnd(28, 62) * Math.PI / 180
    return {
      vx: sp * Math.cos(rad) * (Math.random() < 0.5 ? -1 : 1),
      vy: sp * Math.sin(rad) * (Math.random() < 0.5 ? -1 : 1)
    }
  }

  function newLogo(sp) {
    const w = 86 * scale, h = 44 * scale
    const spot = openSpot(w, h)
    return Object.assign({ w, h, w0: w, h0: h, trail: [], hue: rnd(0, 360) }, spot, heading(sp * scale))
  }

  function newHunter(sp) {
    const L = newLogo(sp)
    L.hunter = true
    L.hue = 0
    return L
  }

  // steers toward the cursor at a capped turn rate, and still bounces off
  // everything, so it arcs around the content instead of tracking perfectly
  function steer(L, dt) {
    if (!pointerIn) return
    const sp = Math.hypot(L.vx, L.vy)
    if (!sp) return
    const want = Math.atan2(my - (L.y + L.h / 2), mx - (L.x + L.w / 2))
    let cur = Math.atan2(L.vy, L.vx)
    let d = want - cur
    while (d > Math.PI) d -= Math.PI * 2
    while (d < -Math.PI) d += Math.PI * 2
    cur += clamp(d, -2.1 * dt, 2.1 * dt)
    L.vx = Math.cos(cur) * sp
    L.vy = Math.sin(cur) * sp
  }

  function emit(src, ang, sp, hue) {
    if (bits.length >= MAXBITS) return
    bits.push({ x: src.x + src.w / 2, y: src.y + src.h / 2, vx: Math.cos(ang) * sp * scale, vy: Math.sin(ang) * sp * scale, life: 7, hue })
  }

  // bullets are stopped by the content, so hiding behind the bio still works
  function stepBits(dt) {
    const r = 3.5 * scale
    for (let k = bits.length - 1; k >= 0; k--) {
      const b = bits[k]
      b.life -= dt
      b.x += b.vx * dt
      b.y += b.vy * dt
      let dead = b.life <= 0 || b.x < -10 || b.y < -10 || b.x > W + 10 || b.y > H + 10
      if (!dead) {
        for (const o of walls) if (solidAt(b.x - r, b.y - r, b.x + r, b.y + r, o)) { dead = true; break }
      }
      if (dead) { bits.splice(k, 1); continue }
      if (invuln <= 0 && cursorHits(b.x - r, b.y - r, b.x + r, b.y + r)) {
        bits.splice(k, 1)
        hurt()
        return
      }
    }
  }

  function newBall() {
    const w = 60 * scale, h = 31 * scale
    const sp = 520 * scale
    const rad = rnd(50, 70) * Math.PI / 180
    return {
      x: W / 2 - w / 2, y: H - 130, w, h, w0: w, h0: h, trail: [], hue: rnd(0, 360),
      vx: sp * Math.cos(rad) * (Math.random() < 0.5 ? -1 : 1),
      vy: -sp * Math.sin(rad)
    }
  }

  /* -------------------------------------------------------- physics */

  function recolor(L) {
    if (!L.hunter) L.hue = (L.hue + 47) % 360
  }

  function burst(L, n) {
    for (let k = 0; k < (n || 7); k++) {
      const a = rnd(0, Math.PI * 2)
      const s = rnd(40, 190)
      parts.push({ x: L.x + L.w / 2, y: L.y + L.h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.25, 0.6), hue: L.hue })
    }
  }

  function corner() {
    flash = 0.5
    shake = 0.35
    sfx('corner')
  }

  function killBrick(o) {
    o.el.classList.add('dead')
    score += PTS_BRICK
    sfx('brick')
    measure()
    if (!document.querySelector('brik:not(.dead)')) finish(true)
  }

  function micro(L, dt) {
    L.x += L.vx * dt
    L.y += L.vy * dt
    let bx = false, by = false

    if (L.x < 0) { L.x = 0; L.vx = Math.abs(L.vx); bx = true }
    if (L.x + L.w > W) { L.x = W - L.w; L.vx = -Math.abs(L.vx); bx = true }
    if (L.y < 0) { L.y = 0; L.vy = Math.abs(L.vy); by = true }
    if (L.y + L.h > H) {
      if (state === BRK) return true
      L.y = H - L.h
      L.vy = -Math.abs(L.vy)
      by = true
    }
    if (bx && by) corner()

    // least-penetration resolve. doubles as the escape hatch when a resize
    // traps the logo inside a wall.
    let struck = false
    for (const o of walls) {
      const hit = solidAt(L.x, L.y, L.x + L.w, L.y + L.h, o)
      if (!hit) continue
      const pl = L.x + L.w - hit.l, pr = hit.r - L.x
      const pt = L.y + L.h - hit.t, pb = hit.b - L.y
      const m = Math.min(pl, pr, pt, pb)
      if (m === pl) { L.x -= pl; L.vx = -Math.abs(L.vx) }
      else if (m === pr) { L.x += pr; L.vx = Math.abs(L.vx) }
      else if (m === pt) { L.y -= pt; L.vy = -Math.abs(L.vy) }
      else { L.y += pb; L.vy = Math.abs(L.vy) }
      struck = true
      // a brick kill rebuilds the wall list, so stop. otherwise keep going: a
      // logo wedged between two walls must be resolved out of both, or it sits
      // inside the second one until some later step happens to catch it.
      if (o.brick) { killBrick(o); break }
    }

    if (paddle && L.vy > 0 && overlaps(L, { l: paddle.x, r: paddle.x + paddle.w, t: paddle.y, b: paddle.y + paddle.h })) {
      L.y = paddle.y - L.h
      let off = clamp((L.x + L.w / 2 - (paddle.x + paddle.w / 2)) / (paddle.w / 2), -1, 1)
      // a dead centre hit gives vx = 0 and the ball loops up and down forever
      if (Math.abs(off) < 0.15) off = 0.15 * (L.vx < 0 ? -1 : 1)
      // and a perfectly repeatable angle can trace a closed path that never
      // reaches the last brick. jitter it just enough to break the cycle.
      off = clamp(off + rnd(-0.05, 0.05), -1, 1)
      const sp = Math.min(1400 * scale, Math.hypot(L.vx, L.vy) * 1.02)
      const ang = off * Math.PI / 3
      L.vx = sp * Math.sin(ang)
      L.vy = -sp * Math.cos(ang)
      recolor(L)
      burst(L, 5)
      sfx('pad')
      padHits++
    }

    if (bx || by || struck) { recolor(L); burst(L); sfx('bounce') }
    return false
  }

  /* --------------------------------------------------------- phases */

  const say = (a, b) => { banner = { a, b, t: 1.7 } }

  function toWhack() {
    state = WHACK
    bits = []
    toast = null
    paddle = null
    dash.innerHTML = BIO
    measure()
    // keep the exact logo the player just clicked. speeding it up in place
    // reads as the screensaver waking up, not as a new round being dealt.
    const kept = logos[0] || newLogo(START_SPEED)
    const was = Math.hypot(kept.vx, kept.vy) || 1
    const k = START_SPEED * scale / was
    kept.vx *= k
    kept.vy *= k
    kept.w = kept.w0
    kept.h = kept.h0
    kept.trail = []
    contain(kept)
    eject(kept)
    logos = [kept]
    setTempo(132)
    say('PHASE 1 / 3', 'click the logo x' + TARGET + '. it gets faster')
  }

  function toDodge() {
    state = DODGE
    clock = SURVIVE
    spawnIn = 4
    invuln = 1.3
    camp = CAMP_MAX
    if (touch) parkAvatar()
    bits = []
    waveIdx = 0
    emitIn = 0
    burstIn = 5
    spinIn = 0
    spinAng = 0
    toast = null
    paddle = null
    dash.innerHTML = BIO
    measure()
    // phase 1 ends tiny and near the speed cap. grow it back before splitting,
    // otherwise dodge opens at a speed nothing can be dodged at.
    const seed = logos[0] || newLogo(400)
    seed.w = seed.w0
    seed.h = seed.h0
    Object.assign(seed, heading(400 * scale))
    contain(seed)
    eject(seed)
    const twin = Object.assign({}, seed, { trail: [] }, heading(400 * scale))
    contain(twin)
    eject(twin)
    logos = [seed, twin]
    setTempo(152)
    sfx('split')
    say('PHASE 2 / 3', 'that was a warmup')
  }

  function toBreak() {
    state = BRK
    bits = []
    toast = null
    dash.innerHTML = BIO.split('\n').map(l => '<brik>' + l + '</brik>').join('\n')
    bricksTotal = document.querySelectorAll('brik').length
    measure()
    logos = [newBall()]
    eject(logos[0])
    paddle = { x: W / 2 - 59 * scale, y: H - 28, w: 118 * scale, h: 8 }
    setTempo(170)
    say('PHASE 3 / 3', 'not bad...')
  }

  function hurt() {
    lives--
    invuln = 1.6
    shake = 0.4
    sfx(lives > 0 ? 'hurt' : 'dead')
    if (lives <= 0) finish(false)
  }

  function finish(won, laid) {
    const at = state
    state = DONE
    paddle = null
    bits = []
    toast = null
    musicOff()
    sfx(won ? 'win' : 'dead')
    // each phase pays out for how well it went, not merely that it happened.
    // par is twice perfect in both cases, and derived from the phase's own size
    // so retuning TARGET or editing the bio retunes the scoring with it.
    const acc = hits >= TARGET ? Math.max(0, TARGET * PAR_CLICK_MULT - clicks) * PTS_CLICK : 0
    const dry = at === BRK ? Math.round(clamp(camp / CAMP_MAX, 0, 1) * PTS_VOID) : 0
    const fast = won ? Math.max(0, bricksTotal * PAR_PAD_MULT - padHits) * PTS_PAD : 0
    // no severance. a layoff keeps its lives but must not out-earn a clear.
    score += (laid ? 0 : lives) * PTS_LIFE + acc + dry + fast
    const S = Math.round(score)
    if (won) {
      endMsg = ['CLEARED', 'score ' + S,
        lives + ' of ' + LIVES + ' lives  +' + lives * PTS_LIFE +
        '   .   ' + clicks + ' clicks  +' + acc,
        'camped ' + (CAMP_MAX - camp).toFixed(1) + 's of ' + CAMP_MAX + '  +' + dry +
        '   .   ' + padHits + ' paddle hits  +' + fast]
    } else {
      endMsg = laid
        ? ['LAID OFF', 'you stopped moving   .   score ' + S]
        : ['YOU DIED', 'phase ' + (at - 1) + ' / 3   .   score ' + S]
      // phase 2 is the only one on a clock, so it can say how close you got
      if (at === DODGE) {
        const gone = clamp(SURVIVE - clock, 0, SURVIVE)
        const left = clamp(clock, 0, SURVIVE)
        endMsg.push('survived ' + gone.toFixed(1) + 's of ' + SURVIVE + '   .   ' + left.toFixed(1) + 's short   .   wave ' + (waveIdx + 1) + ' / ' + WAVES.length)
      }
    }
  }

  function begin(phase) {
    // the only place lives and score are handed out. phases carry both forward.
    lives = LIVES
    score = 0
    hits = 0
    clicks = 0
    padHits = 0
    audioUp()
    if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume()
    musicOn()
    if (window.nameLoop) window.nameLoop.stop()
    cvs.classList.add('live')
    parts = []
    wake()
    if (phase === 3) toBreak()
    else if (phase === 2) toDodge()
    else toWhack()
  }

  function quit() {
    state = IDLE
    logos = []
    bits = []
    toast = null
    parts = []
    paddle = null
    banner = null
    endMsg = null
    dash.innerHTML = BIO
    cvs.classList.remove('live')
    ctx.clearRect(0, 0, W, H)
    cancelAnimationFrame(raf)
    raf = 0
    musicOff()
    if (window.nameLoop) window.nameLoop.start()
    showSaver()
  }

  /* ----------------------------------------------------------- loop */

  function update(dt) {
    T += dt
    // the end screen waits for a click. it never dismisses itself.
    if (state === DONE) return
    if (paddle && pointerIn) paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w)

    for (let k = logos.length - 1; k >= 0; k--) {
      const L = logos[k]
      if (L.hunter && state === DODGE) steer(L, dt)
      const steps = Math.max(1, Math.ceil(Math.hypot(L.vx, L.vy) * dt / 5))
      let fell = false
      for (let s = 0; s < steps && !fell; s++) fell = micro(L, dt / steps)
      L.trail.push({ x: L.x, y: L.y, w: L.w, h: L.h })
      // bound the forgiving zone to BACK logo-lengths of travel. scaling it by
      // time instead turns into a long invisible clickable streak at speed.
      const back = L.w * BACK
      while (L.trail.length > 30 || (L.trail.length > 1 && Math.hypot(L.x - L.trail[0].x, L.y - L.trail[0].y) > back)) L.trail.shift()
      if (fell) {
        logos.splice(k, 1)
        hurt()
        if (state === BRK) logos.push(newBall())
      }
    }

    if (state === SAVER) saverAge += dt

    if (state === DODGE) {
      clock -= dt
      score += PTS_SEC * dt
      const gone = SURVIVE - clock

      while (waveIdx < WAVES.length - 1 && gone >= WAVES[waveIdx + 1].at) {
        waveIdx++
        const w = WAVES[waveIdx]
        score += PTS_WAVE
        if (w.msg) { toast = { m: w.msg, t: 2.6 }; sfx('burst') }
        if (w.hunter) logos.push(newHunter(320 + waveIdx * 30))
        setTempo(152 + waveIdx * 7)
      }
      const w = WAVES[waveIdx]

      spawnIn -= dt
      if (spawnIn <= 0 && logos.length < w.cap) {
        logos.push(newLogo(400 + logos.length * 25))
        spawnIn = w.gap
        sfx('split')
      }

      // point blank shots are unavoidable rather than hard, so a logo already
      // on top of you does not also get to fire
      const far = src => Math.hypot(src.x + src.w / 2 - mx, src.y + src.h / 2 - my) > 90 * scale

      if (w.emit > 0) {
        emitIn -= dt
        if (emitIn <= 0) {
          emitIn = w.emit
          const src = logos[(Math.random() * logos.length) | 0]
          if (src && (!pointerIn || far(src))) {
            const aim = Math.atan2(my - (src.y + src.h / 2), mx - (src.x + src.w / 2))
            const n = waveIdx >= 5 ? 3 : waveIdx >= 4 ? 2 : 1
            for (let k = 0; k < n; k++) {
              const ang = pointerIn ? aim + (k - (n - 1) / 2) * 0.16 + rnd(-0.05, 0.05) : rnd(0, Math.PI * 2)
              emit(src, ang, 380, src.hue)
            }
            sfx('shot')
          }
        }
      }

      if (w.ring > 0) {
        burstIn -= dt
        if (burstIn <= 0) {
          burstIn = w.ring
          const src = logos[(Math.random() * logos.length) | 0]
          if (src) {
            const off = rnd(0, Math.PI * 2)
            for (let k = 0; k < 14; k++) emit(src, off + k * Math.PI / 7, 250, src.hue)
            sfx('burst')
          }
        }
      }

      // one designated emitter sweeping a fixed step, so it reads as a spiral
      // instead of noise. two opposed arms.
      if (w.spin > 0) {
        spinIn -= dt
        if (spinIn <= 0) {
          spinIn = w.spin
          const src = logos[0]
          if (src) {
            spinAng += 0.41
            emit(src, spinAng, 270, src.hue)
            emit(src, spinAng + Math.PI, 270, src.hue)
          }
        }
      }

      if (invuln > 0) invuln -= dt
      else {
        for (const L of logos) {
          if (cursorHits(L.x, L.y, L.x + L.w, L.y + L.h)) { hurt(); break }
        }
      }

      if (state === DODGE) stepBits(dt)

      if (state === DODGE) {
        if (camping()) {
          camp -= dt
          if (camp <= 0) {
            camp = 0
            shake = 0.5
            finish(false, true)
          }
        }
      }

      if (clock <= 0 && state === DODGE) toBreak()
    }
  }

  function drawLogo(L) {
    const dim = state === DODGE && invuln > 0 && ((invuln * 12) | 0) % 2 === 0
    ctx.save()
    ctx.globalAlpha = dim ? 0.45 : 1
    ctx.translate(L.x + L.w / 2, L.y + L.h / 2)
    const col = 'hsl(' + (L.hue | 0) + ' 100% 62%)'
    ctx.fillStyle = col
    ctx.strokeStyle = col
    ctx.font = 'italic 900 ' + (L.h * 0.66).toFixed(1) + 'px Arial Black, Helvetica, sans-serif'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillText('DVD', 0, -L.h * 0.13)
    ctx.beginPath()
    ctx.ellipse(0, L.h * 0.29, L.w * 0.44, L.h * 0.17, 0, 0, Math.PI * 2)
    ctx.lineWidth = Math.max(1.5, L.h * 0.085)
    ctx.stroke()
    ctx.restore()
  }

  function drawBits() {
    const r = 3.5 * scale
    for (const b of bits) {
      ctx.fillStyle = 'hsl(' + (b.hue | 0) + ' 100% 70%)'
      ctx.fillRect(b.x - r, b.y - r, r * 2, r * 2)
    }
  }

  function drawParts(dt) {
    for (let k = parts.length - 1; k >= 0; k--) {
      const p = parts[k]
      p.life -= dt
      if (p.life <= 0) { parts.splice(k, 1); continue }
      p.x += p.vx * dt
      p.y += p.vy * dt
      p.vy += 260 * dt
      ctx.globalAlpha = clamp(p.life * 2, 0, 1)
      ctx.fillStyle = 'hsl(' + (p.hue | 0) + ' 100% 65%)'
      ctx.fillRect(p.x, p.y, 3, 3)
    }
    ctx.globalAlpha = 1
  }

  function drawPaddle() {
    ctx.fillStyle = '#0ff'
    ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h)
    ctx.fillStyle = '#f0f'
    ctx.fillRect(paddle.x + paddle.w / 2 - 2, paddle.y, 4, paddle.h)
  }

  function title(s) {
    if (s !== lastTitle) { lastTitle = s; document.title = s }
  }

  function drawHud() {
    ctx.font = (12 * clamp(scale, 0.8, 1)).toFixed(0) + 'px ' + MONO
    ctx.textAlign = 'left'
    ctx.textBaseline = 'bottom'
    const hearts = '*'.repeat(Math.max(0, lives)) + '.'.repeat(Math.max(0, LIVES - lives))
    let line = '', tip = ''

    if (state === SAVER && saverAge > 4.5) {
      const L = logos[0]
      ctx.globalAlpha = clamp((saverAge - 4.5) / 1.2, 0, 0.8)
      ctx.fillStyle = '#0f0'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'top'
      ctx.fillText('click me', L.x + L.w / 2, L.y + L.h + 10)
      ctx.globalAlpha = 1
      return
    }
    if (state === WHACK) { line = 'phase 1/3  whack     ' + hits + '/' + TARGET; tip = 'click the logo' }
    if (state === DODGE) { line = 'phase 2/3  dodge     ' + clock.toFixed(1) + 's   wave ' + (waveIdx + 1) + '/' + WAVES.length + '   lives ' + hearts; tip = touch ? 'drag anywhere to move the arrow' : 'hide behind the text, it stops bullets' }
    if (state === BRK) { line = 'phase 3/3  breakout  ' + document.querySelectorAll('brik:not(.dead)').length + ' left   lives ' + hearts; tip = 'esc to quit' }
    if (!line) return

    ctx.fillStyle = '#0f0'
    ctx.fillText(line, 12, H - 26)
    ctx.fillStyle = '#666'
    ctx.fillText(tip + (A.muted ? '   [muted]' : '   m to mute'), 12, H - 12)
    title(line.replace(/\s+/g, ' '))
  }

  // sits in the upper band, well clear of the centred content, and carries its
  // own backdrop so it stays readable whatever it lands on
  // the shaded patches go down before the sprites, so they read as the page
  // behind being dimmed rather than as a grey square laid over the game
  function drawCampDim() {
    const urg = clamp(1 - camp / CAMP_MAX, 0, 1)
    // drawn a couple of px wider than tested, so the edge of a moving frame
    // never pokes out from under the overlay
    const bleed = 2
    ctx.fillStyle = 'rgba(0,0,0,' + (0.5 + 0.42 * urg).toFixed(3) + ')'
    ctx.beginPath()
    for (const z of dims) ctx.rect(z.l - bleed, z.t - bleed, z.r - z.l + bleed * 2, z.b - z.t + bleed * 2)
    ctx.fill()
  }

  function drawCamp() {
    const cx = W / 2
    const cy = H / 2
    ctx.save()
    // the warning needs its own backdrop now that it is not sitting on one
    ctx.font = 'bold ' + (25 * scale).toFixed(0) + 'px ' + MONO
    const bw = Math.min(W - 16, ctx.measureText('laid off in 00.0s').width + 40 * scale)
    ctx.fillStyle = 'rgba(0,0,0,0.88)'
    ctx.fillRect(cx - bw / 2, cy - 34 * scale, bw, 68 * scale)
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    // flash white over the last couple of seconds
    ctx.fillStyle = camp < 2.5 && ((camp * 7) | 0) % 2 === 0 ? '#fff' : '#f0f'
    ctx.font = 'bold ' + (25 * scale).toFixed(0) + 'px ' + MONO
    ctx.fillText('laid off in ' + Math.max(0, camp).toFixed(1) + 's', cx, cy - 13 * scale)
    ctx.fillStyle = '#888'
    ctx.font = (13 * scale).toFixed(0) + 'px ' + MONO
    ctx.fillText('return to the void.', cx, cy + 15 * scale)
    ctx.restore()
  }

  function drawToast() {
    ctx.save()
    ctx.globalAlpha = clamp(toast.t / 0.5, 0, 1)
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.font = 'bold ' + (14 * scale).toFixed(0) + 'px ' + MONO
    const cx = W / 2
    const cy = Math.max(30, H * 0.08)
    const bw = ctx.measureText(toast.m).width + 28 * scale
    ctx.fillStyle = 'rgba(0,0,0,0.9)'
    ctx.fillRect(cx - bw / 2, cy - 15 * scale, bw, 30 * scale)
    ctx.fillStyle = '#f0f'
    ctx.fillText(toast.m, cx, cy)
    ctx.restore()
  }

  function drawBanner() {
    const big = 'bold ' + (28 * scale).toFixed(0) + 'px ' + MONO
    const small = (13 * scale).toFixed(0) + 'px ' + MONO
    const cx = W / 2
    const cy = Math.max(58, H * 0.15)
    ctx.save()
    ctx.globalAlpha = clamp(banner.t / 0.35, 0, 1)
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.font = big
    const w1 = ctx.measureText(banner.a).width
    ctx.font = small
    const w2 = ctx.measureText(banner.b).width
    const bw = Math.min(W - 16, Math.max(w1, w2) + 44 * scale)
    const bh = 74 * scale
    ctx.fillStyle = 'rgba(0,0,0,0.9)'
    ctx.fillRect(cx - bw / 2, cy - bh / 2, bw, bh)
    ctx.strokeStyle = '#333'
    ctx.lineWidth = 1
    ctx.strokeRect(cx - bw / 2 + 0.5, cy - bh / 2 + 0.5, bw - 1, bh - 1)
    ctx.fillStyle = '#ff0'
    ctx.font = big
    ctx.fillText(banner.a, cx, cy - 15 * scale)
    ctx.fillStyle = '#0ff'
    ctx.font = small
    ctx.fillText(banner.b, cx, cy + 16 * scale)
    ctx.restore()
    title(banner.a + ' ' + banner.b)
  }

  function drawEnd() {
    ctx.fillStyle = 'rgba(0,0,0,0.72)'
    ctx.fillRect(0, 0, W, H)
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillStyle = endMsg[0] === 'CLEARED' ? '#0f0' : '#f0f'
    ctx.font = 'bold ' + (38 * scale).toFixed(0) + 'px ' + MONO
    ctx.fillText(endMsg[0], W / 2, H / 2 - 20 * scale)
    ctx.fillStyle = '#0ff'
    ctx.font = (14 * scale).toFixed(0) + 'px ' + MONO
    let y = H / 2 + 16 * scale
    for (let i = 1; i < endMsg.length; i++) {
      ctx.fillStyle = i === 1 ? '#0ff' : '#ff0'
      ctx.fillText(endMsg[i], W / 2, y)
      y += 21 * scale
    }
    ctx.fillStyle = '#666'
    ctx.fillText('click anywhere', W / 2, y + 8 * scale)
    title(endMsg[0] + ' - ' + endMsg[1] + (endMsg[2] ? ' - ' + endMsg[2] : ''))
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000)
    last = now
    ctx.clearRect(0, 0, W, H)

    if (banner) {
      banner.t -= dt
      if (banner.t <= 0) banner = null
    } else {
      update(dt)
    }

    // evaluated once: the backdrop and the readout must agree within a frame
    const nagging = state === DODGE && !banner && camping()
    if (nagging) drawCampDim()

    ctx.save()
    if (shake > 0) {
      shake -= dt
      const s = shake * 45
      ctx.translate(rnd(-s, s), rnd(-s, s))
    }
    if (paddle) drawPaddle()
    for (const L of logos) drawLogo(L)
    drawBits()
    drawParts(dt)
    if (touch && state === DODGE) drawAvatar()
    ctx.restore()

    if (flash > 0) {
      flash -= dt
      ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.65).toFixed(3) + ')'
      ctx.fillRect(0, 0, W, H)
    }

    if (toast) {
      toast.t -= dt
      if (toast.t <= 0) toast = null
    }
    if (nagging) drawCamp()
    if (state === DONE && endMsg) drawEnd()
    else if (banner) drawBanner()
    else {
      drawHud()
      if (toast) drawToast()
    }

    raf = requestAnimationFrame(frame)
  }

  /* ---------------------------------------------------------- input */

  function wake() {
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame) }
  }

  function toSaver() {
    if (state !== IDLE) return
    state = SAVER
    saverAge = 0
    resize()
    logos = [newLogo(230)]
    wake()
  }

  // no idle wait. the logo is there the moment the page is, and comes straight
  // back after a game ends.
  function showSaver() {
    if (state !== IDLE) return
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
    toSaver()
  }

  // a click counts anywhere along the last half logo-length of travel. enough
  // to absorb input and frame lag for a player tracking the logo, without the
  // hitbox growing as it speeds up.
  function inLogo(L, x, y) {
    const p = 4 * scale
    const box = b => x > b.x - p && x < b.x + b.w + p && y > b.y - p && y < b.y + b.h + p
    if (box(L)) return true
    for (let k = 0; k < L.trail.length; k++) if (box(L.trail[k])) return true
    return false
  }

  function pick(x, y) {
    let best = null, bd = Infinity
    for (const L of logos) {
      if (!inLogo(L, x, y)) continue
      const d = Math.hypot(x - (L.x + L.w / 2), y - (L.y + L.h / 2))
      if (d < bd) { bd = d; best = L }
    }
    return best
  }

  document.addEventListener('click', e => {
    if (state === SAVER) {
      if (pick(e.clientX, e.clientY)) {
        e.preventDefault()
        e.stopPropagation()
        begin(1)
      }
      return
    }
    if (state === DONE) { quit(); return }
    if (state === WHACK) {
      clicks++
      const L = pick(e.clientX, e.clientY)
      if (L) {
        hits++
        score += PTS_HIT
        sfx('hit')
        burst(L, 16)
        // eased against progress rather than a flat multiplier per hit, so the
        // first couple of clicks jump hard and the last few only tighten it
        const t = Math.min(1, hits / TARGET)
        const e = 1 - (1 - t) * (1 - t)
        const h = heading((START_SPEED + (MAX_SPEED - START_SPEED) * e) * scale)
        L.vx = h.vx
        L.vy = h.vy
        // shrink about the centre so it does not jump sideways as it goes
        const f = 1 + (MIN_SIZE - 1) * e
        const nw = L.w0 * f
        const nh = L.h0 * f
        L.x += (L.w - nw) / 2
        L.y += (L.h - nh) / 2
        L.w = nw
        L.h = nh
        recolor(L)
        if (hits >= TARGET) toDodge()
      } else sfx('miss')
    }
  }, true)

  // a touch pointer only exists while a finger is down, so from the first
  // touch we keep our own persistent one and drag it relatively
  // park it clear of the content, or the player opens the phase already
  // camping and gets laid off for standing where we put them
  function parkAvatar() {
    pointerIn = true
    const w = CUR.w * curScale(), h = CUR.h * curScale()
    // park clear of everything: below the lowest zone, else above the highest
    let lo = 0, hi = H
    for (const z of zones) { lo = Math.max(lo, z.b); hi = Math.min(hi, z.t) }
    const spots = zones.length
      ? [{ x: W / 2 - w / 2, y: lo + 12 }, { x: W / 2 - w / 2, y: hi - h - 12 },
         { x: 12, y: H - h - 12 }, { x: W - w - 12, y: 12 }]
      : [{ x: W / 2 - w / 2, y: H * 0.72 }]
    for (const c of spots) {
      if (c.x < 0 || c.y < 0 || c.x + w > W || c.y + h > H) continue
      mx = c.x
      my = c.y
      if (!camping()) return
    }
    mx = clamp(W / 2 - w / 2, 0, Math.max(0, W - w))
    my = clamp(H - h - 12, 0, Math.max(0, H - h))
  }

  function markTouch(e) {
    if (touch || !e || e.pointerType !== 'touch') return
    touch = true
    parkAvatar()
  }

  addEventListener('pointerdown', e => {
    markTouch(e)
    if (touch) {
      grabX = mx - e.clientX
      grabY = my - e.clientY
      // only lift when the finger physically lands ON the avatar, where it
      // would be hidden. grabbing from anywhere else must stay purely relative,
      // including from above it.
      const cw = CUR.w * curScale(), ch = CUR.h * curScale()
      const onIt = e.clientX > mx - 8 && e.clientX < mx + cw + 8 &&
                   e.clientY > my - 8 && e.clientY < my + ch + 8
      if (onIt) {
        grabY = -LIFT
        my = clamp(e.clientY + grabY, 0, Math.max(0, H - ch))
      }
      return
    }
    mx = e.clientX
    my = e.clientY
    pointerIn = true
  }, { passive: true })

  addEventListener('pointermove', e => {
    markTouch(e)
    if (touch) {
      // keep the whole avatar on screen, not just its hotspot
      mx = clamp(e.clientX + grabX, 0, Math.max(0, W - CUR.w * curScale()))
      my = clamp(e.clientY + grabY, 0, Math.max(0, H - CUR.h * curScale()))
    } else {
      mx = e.clientX
      my = e.clientY
      pointerIn = true
    }
    if (state === IDLE) showSaver()
  }, { passive: true })

  document.addEventListener('mouseleave', () => { if (!touch) pointerIn = false })
  document.addEventListener('mouseenter', () => { if (!touch) pointerIn = true })

  addEventListener('keydown', e => {
    if (e.key === 'Escape' && state !== IDLE) { quit(); return }
    if (e.key === 'm' || e.key === 'M') {
      setMuted(!A.muted)
      return
    }
    if (state === IDLE) { showSaver(); return }
    if (e.key === '1' || e.key === '2' || e.key === '3') begin(+e.key)
  })

  addEventListener('resize', resize)
  addEventListener('scroll', () => { if (state === IDLE) showSaver() }, { passive: true })
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure)
  addEventListener('load', measure)

  loadCursor()
  loadPengMask()
  // a media element that is still fetching holds the window load event open, so
  // preloading at init makes the tab spin for the length of the download even
  // though the page is already painted. warm it up once loading is done instead.
  if (MUSIC === 'file' && MUSIC_PRELOAD) {
    if (document.readyState === 'complete') makeTrack()
    else addEventListener('load', () => makeTrack())
  }
  resize()
  showSaver()
})()
</script>
</body>
</html>
